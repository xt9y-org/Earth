name: Inspect Earth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-earth.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Horse dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglfw3-dev libgl1-mesa-dev libglu1-mesa-dev
          git clone --depth 1 --branch v2.9.3 https://github.com/xt9y/lwcgl.git "$RUNNER_TEMP/lwcgl"
          make -C "$RUNNER_TEMP/lwcgl" clean all
          sudo make -C "$RUNNER_TEMP/lwcgl" install
          git clone --depth 1 https://github.com/xt9y/C-BuildSystem.git "$RUNNER_TEMP/cbuild"
          make -C "$RUNNER_TEMP/cbuild" clean all
          sudo make -C "$RUNNER_TEMP/cbuild" install
          git clone --depth 1 https://github.com/xt9y/Horse.git "$RUNNER_TEMP/Horse"
          cd "$RUNNER_TEMP/Horse"
          c build
      - name: Print imported Earth parts
        run: |
          HORSE="$RUNNER_TEMP/Horse"
          LIB="$(find "$HORSE/build" -type f -name 'libecs-model-rasterizer.so' | head -1)"
          LIBDIR="$(dirname "$LIB")"
          cat > /tmp/inspect.cpp <<'CPP'
          #include "Models/Models.hpp"
          #include <cstdio>
          #include <string>
          int main() {
              std::string error;
              auto model = Models::load("Earth.fbx", &error);
              if (model == Models::INVALID_MODEL) {
                  std::fprintf(stderr, "load failed: %s\n", error.c_str());
                  return 2;
              }
              std::printf("parts=%zu\n", Models::partCount(model));
              for (std::size_t i = 0; i < Models::partCount(model); ++i) {
                  auto *part = Models::part(model, i);
                  auto *mesh = part ? Models::mesh(part->mesh) : nullptr;
                  auto *mat = part ? Models::material(part->material) : nullptr;
                  std::printf("part=%zu mat=%s opacity=%.6f texture_path=%s diffuse=%u ",
                      i,
                      mat ? mat->name.c_str() : "<null>",
                      mat ? mat->opacity : -1.0f,
                      mat ? mat->texture_path.c_str() : "<null>",
                      mat ? mat->diffuse_texture : 0xffffffffu);
                  if (mesh) {
                      std::printf("bounds=[%.6f %.6f %.6f]-[%.6f %.6f %.6f] tris=%zu\n",
                          mesh->bounds.minimum.x, mesh->bounds.minimum.y, mesh->bounds.minimum.z,
                          mesh->bounds.maximum.x, mesh->bounds.maximum.y, mesh->bounds.maximum.z,
                          mesh->indices.size()/3u);
                  } else std::printf("mesh=<null>\n");
              }
              return 0;
          }
          CPP
          c++ -std=c++20 -I"$HORSE/Sources" /tmp/inspect.cpp -L"$LIBDIR" -lecs-model-rasterizer \
            -Wl,-rpath,"$LIBDIR" -Wl,-rpath,/usr/local/lib -o /tmp/inspect-earth
          LD_LIBRARY_PATH="$LIBDIR:/usr/local/lib:${LD_LIBRARY_PATH:-}" /tmp/inspect-earth
