name: Horse FBX Regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/horse-fbx-regression.yml'
  workflow_dispatch:

jobs:
  exact-earth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglfw3-dev libgl1-mesa-dev libglu1-mesa-dev
          git clone --depth 1 --branch v2.9.3 https://github.com/xt9y/lwcgl.git "$RUNNER_TEMP/lwcgl"
          make -C "$RUNNER_TEMP/lwcgl" clean all
          sudo make -C "$RUNNER_TEMP/lwcgl" install
          git clone --depth 1 https://github.com/xt9y/C-BuildSystem.git "$RUNNER_TEMP/c-buildsystem"
          make -C "$RUNNER_TEMP/c-buildsystem" clean all
          sudo make -C "$RUNNER_TEMP/c-buildsystem" install
      - name: Build exact Horse revision
        run: |
          git clone --depth 1 https://github.com/xt9y/Horse.git "$RUNNER_TEMP/Horse"
          test "$(git -C "$RUNNER_TEMP/Horse" rev-parse HEAD)" = "72cbf3f115f9736d47e1dd0fbe56f82b3660ce6c"
          c --directory "$RUNNER_TEMP/Horse" build
      - name: Run exact Earth FBX contract
        run: |
          set -euo pipefail
          HORSE="$RUNNER_TEMP/Horse"
          LIB="$(find "$HORSE/build" -type f -name 'libecs-model-rasterizer.so' | head -1)"
          test -n "$LIB"
          LIBDIR="$(cd "$(dirname "$LIB")" && pwd)"
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I"$HORSE" -I"$HORSE/Sources" \
            "$HORSE/tests/earth_fbx_contract.cpp" \
            -L"$LIBDIR" -lecs-model-rasterizer \
            -Wl,-rpath,"$LIBDIR" -Wl,-rpath,/usr/local/lib \
            -o /tmp/earth-fbx-contract
          LD_LIBRARY_PATH="$LIBDIR:/usr/local/lib:${LD_LIBRARY_PATH:-}" \
            /tmp/earth-fbx-contract "$GITHUB_WORKSPACE/Earth.fbx"
